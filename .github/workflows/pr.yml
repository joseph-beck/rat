name: PR

# Run this workflow on every commit to every branch.
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

jobs:
  # Build the application and produce a bundle analysis report.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run Bundle Analyse
        run: pnpm run bundle:analyse

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bundle-snalysis
          path: dist/stats.html

  # Run e2e tests using Playwright.
  e2e:
    name: e2e Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install

      - name: Run Playwright tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # All checks including:
  # - Prettier check for code format.
  # - ESLint check for code quality.
  # - Vitest run unit tests.
  # - Typecheck for type errors.
  checks:
    name: Style and Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Prettier Check
        run: pnpm run fmt

      - name: Run Lint Check
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test

      - name: Run Typecheck
        run: pnpm run typecheck
